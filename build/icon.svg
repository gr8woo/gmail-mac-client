<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Mail and Calendar">
  <defs>
    <linearGradient id="base" x1="160" y1="100" x2="860" y2="940" gradientUnits="userSpaceOnUse"><stop stop-color="#36B5D1"/><stop offset=".48" stop-color="#3279DF"/><stop offset="1" stop-color="#3C49B8"/></linearGradient>
    <linearGradient id="paper" x1="420" y1="260" x2="690" y2="750" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7EFFA"/></linearGradient>
    <linearGradient id="envelope" x1="270" y1="490" x2="700" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="19" flood-color="#102C66" flood-opacity=".25"/></filter>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#base)"/>
  <rect x="81" y="81" width="862" height="862" rx="195" fill="none" stroke="white" stroke-opacity=".18" stroke-width="2"/>
  <!-- Calendar sheet: bold binding tabs remain legible at Dock size. -->
  <g filter="url(#shadow)">
    <rect x="330" y="235" width="450" height="450" rx="56" fill="url(#paper)"/>
    <path d="M386 235h338a56 56 0 0 1 56 56v68H330v-68a56 56 0 0 1 56-56Z" fill="#FF8E70"/>
    <rect x="410" y="198" width="34" height="94" rx="17" fill="#FFFFFF"/>
    <rect x="666" y="198" width="34" height="94" rx="17" fill="#FFFFFF"/>
    <rect x="620" y="405" width="46" height="46" rx="12" fill="#4877BC"/>
    <rect x="692" y="405" width="46" height="46" rx="12" fill="#A4B8D9"/>
  </g>
  <!-- Envelope intersects the calendar: one unified productivity mark. -->
  <g filter="url(#shadow)">
    <rect x="214" y="467" width="510" height="318" rx="48" fill="url(#envelope)"/>
    <path d="m232 756 166-137m308 137L540 619" fill="none" stroke="#C2D4F0" stroke-width="12" stroke-linecap="round"/>
    <path d="m236 489 207 157a43 43 0 0 0 52 0l207-157" fill="none" stroke="#3A72C4" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
